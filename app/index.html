<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marswalk — EVA su Marte</title>
<style>
  html,body{margin:0;height:100%;background:#140c09;color:#f4e3d3;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  button,input{font:inherit;color:inherit}
  #menu{min-height:100%;display:grid;grid-template-columns:1fr;gap:28px;padding:28px 20px 40px;box-sizing:border-box;max-width:1100px;margin:0 auto}
  @media(min-width:900px){#menu{grid-template-columns:1fr 1fr;align-items:center;min-height:100vh}}
  .kicker{letter-spacing:.22em;text-transform:uppercase;color:#ff9a52;font-size:13px;margin:0}
  h1{font-size:clamp(40px,6vw,64px);line-height:.95;margin:8px 0}
  .lead{max-width:38rem;line-height:1.45;color:#d9c3b0}
  .card{border:1px solid #ffffff22;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;background:#1c120e}
  .row{display:flex;gap:8px}
  button{min-height:44px;border-radius:999px;border:1px solid #ffffff22;background:transparent;padding:8px 14px;cursor:pointer}
  button.on,button.primary{background:#ff9a52;color:#140c09;border-color:#ff9a52;font-weight:700}
  button.primary{width:100%;font-size:18px;min-height:48px}
  label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:#d9c3b0}
  input[type=range]{width:100%}
  #globe{height:320px;border-radius:16px;border:1px solid #ffffff22;background:#0c0806;touch-action:none}
  @media(min-width:900px){#globe{height:460px}}
  .muted{color:#d9c3b0;font-size:14px;line-height:1.4}
  .help{display:grid;gap:10px}
  @media(min-width:700px){.help{grid-template-columns:1fr 1fr}}
  .help article{border:1px solid #ffffff22;border-radius:12px;padding:12px}
  .help h2{margin:0 0 4px;color:#ffb37a;font-size:16px}
  #stage{position:fixed;inset:0;display:none;background:#140c09}
  #stage canvas{display:block}
  #load{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000a;padding:10px 14px;border-radius:10px;font-size:14px}
</style>
</head>
<body>
<div id="menu">
  <section>
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="card">
      <div>
        <p class="muted" id="langLabel"></p>
        <div class="row">
          <button type="button" id="btnIt" class="on">Italiano</button>
          <button type="button" id="btnEn">English</button>
        </div>
      </div>
      <label id="sensLabel">Sensibilità
        <input id="sens" type="range" min="0.6" max="1.8" step="0.05" value="1">
      </label>
      <button type="button" id="btnRover"></button>
    </div>
    <p><button type="button" class="primary" id="start"></button></p>
    <div class="help">
      <article><h2 id="questTitle"></h2><p class="muted" id="questBody"></p></article>
      <article><h2 id="pcTitle"></h2><p class="muted" id="pcBody"></p></article>
    </div>
  </section>
  <section>
    <div id="globe"></div>
    <p><b id="globeTitle"></b><br><span class="muted" id="globeHelp"></span></p>
    <label id="scaleLabel">Scala
      <input id="scale" type="range" min="0.35" max="4" step="0.05" value="1">
    </label>
    <p class="muted" id="scaleRead">1.0×</p>
  </section>
</div>
<div id="stage"><div id="load">…</div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
